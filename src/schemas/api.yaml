openapi: 3.1.0
info:
  title: Example API
  version: "2026-05-10"
  summary: A small, generic API used to demonstrate the OpenAPI reference in this template.
  description: |
    Replace this schema with your own OpenAPI document. `starlight-openapi` will
    regenerate the reference pages under `/api/` automatically on the next build.

    The endpoints below describe a fictional `widgets` resource — enough to show
    request bodies, path parameters, error responses, and authentication.
  contact:
    name: Your team
    url: https://example.com/support
    email: support@example.com
  license:
    name: MIT
servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://api.sandbox.example.com/v1
    description: Sandbox
security:
  - bearerAuth: []
tags:
  - name: Widgets
    description: Create, retrieve, and manage widgets.
paths:
  /widgets:
    get:
      tags: [Widgets]
      summary: List widgets
      description: Returns a paginated list of widgets owned by the authenticated account.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of widgets to return.
        - in: query
          name: cursor
          schema:
            type: string
          description: Pagination cursor returned by a previous response.
      responses:
        "200":
          description: A page of widgets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Widgets]
      summary: Create a widget
      description: Creates a new widget on the authenticated account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetCreate"
      responses:
        "201":
          description: The newly created widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /widgets/{widgetId}:
    parameters:
      - in: path
        name: widgetId
        required: true
        schema:
          type: string
        description: The unique identifier of the widget.
    get:
      tags: [Widgets]
      summary: Retrieve a widget
      responses:
        "200":
          description: The requested widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Widgets]
      summary: Delete a widget
      responses:
        "204":
          description: The widget was deleted.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Send your API key as a bearer token in the `Authorization` header:
        `Authorization: Bearer sk_live_...`
  schemas:
    Widget:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          example: wdg_01H8Z9XJ7M3K4P5Q6R7S8T9V0W
        name:
          type: string
          example: My first widget
        description:
          type: string
          nullable: true
          example: Optional human-readable description.
        created_at:
          type: string
          format: date-time
    WidgetCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: My first widget
        description:
          type: string
    WidgetList:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
        has_more:
          type: boolean
          description: Whether more widgets are available beyond this page.
        next_cursor:
          type: string
          nullable: true
          description: Cursor to pass on the next request to fetch the following page.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: The `name` field is required.
        request_id:
          type: string
          example: req_01H8Z9XJ7M3K4P5Q6R7S8T9V0W
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed or was not provided.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
