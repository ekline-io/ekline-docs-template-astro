name: CI

# Runs on pull requests and on pushes to the default branch.
#
# The Vercel build also runs `npm test` (see `buildCommand` in `vercel.json`),
# but that only gates the deploy, and only for the checks that need no browser.
# This workflow adds the two things that gate nothing today: type checking, and
# the browser tests that cover how Scalar and Starlight fit together — theme,
# search, navigation, and overlay stacking. Those all produce a page that builds
# perfectly and behaves wrongly, so nothing else can catch them.
on:
  pull_request:
  push:
    branches: [main]
  # Vercel reports each preview and production deployment through GitHub's
  # deployments API. The `smoke` job below runs the deployed smoke test against
  # the URL it reports — the only place markdown negotiation can be observed.
  deployment_status:

# Every job here reads the repository and nothing else: check out a commit,
# install, build, test. Nothing writes to the repo, opens a pull request, or
# touches releases or packages, so the token they get should be able to do
# none of that. Artifact upload is unaffected — it authenticates with the
# runtime token, not this one.
permissions:
  contents: read

# A newer push still supersedes an in-flight run for the same branch. Deployment
# runs are additionally keyed per deployment, via `github.event.deployment.id`
# (empty for push/PR events, so that behaviour is unchanged) — both Vercel
# projects fire `deployment_status` for the same branch within moments of each
# other, and without this key the second one to land would cancel the first's
# smoke run rather than running alongside it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, build and test
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    # A healthy run is ~2 minutes. Tight enough that a stall is caught early
    # rather than burning a quarter-hour of runner time.
    timeout-minutes: 10

    defaults:
      run:
        # Every step runs inside the shipped template. The repo root has no
        # dependencies of its own — each project under packages/ and apps/ is
        # independent and carries its own lockfile, so that a customer who
        # extracts packages/template/ gets a locked install. See
        # docs/superpowers/plans/2026-08-21-monorepo-move.md.
        working-directory: packages/template

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the version this template is verified against; see CLAUDE.md.
          node-version: 22.x
          cache: npm
          # `defaults.run.working-directory` does not reach action inputs, so
          # the cache needs the lockfile's path spelled out.
          cache-dependency-path: packages/template/package-lock.json

      # Runs at the repo root, not in the template, and needs no dependencies —
      # it is plain Node over the markdown under packages/template/. Placed
      # before the install so a docs-only regression reports in seconds.
      #
      # It catches prose that describes this monorepo to a reader who does not
      # have it: a link into apps/, a workflow path under .github/. Those all
      # resolve here and break in a customer's copy, where nothing fails loudly.
      - name: Check what ships to customers
        working-directory: .
        run: npm run check:shipped

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build and test
        run: npm test

      # A second build, with the Vercel adapter. The markdown-negotiation routes
      # exist only in `.vercel/output/config.json`, which the Node-adapter build
      # above never produces, so without this step they are checked only by
      # Vercel's own build — after merge, at deploy time. `staticDir()` prefers
      # a `dist/client/` over `.vercel/output/static/`, so the Node output goes
      # first. The browser tests below rebuild with the Node adapter anyway.
      - name: Build with the Vercel adapter and check its routing config
        run: |
          rm -rf dist .vercel
          VERCEL=1 npm run build
          node --test tests/markdown-twins.test.mjs tests/markdown-negotiation.test.mjs

      # Keyed on the Playwright version, not the lockfile.
      #
      # The browser download is ~150MB and only ever changes when Playwright
      # does. Hashing `package-lock.json` threw the cache away on every
      # unrelated dependency bump and re-downloaded it for nothing.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Runs even on a cache hit: the cache holds the browser, but `--with-deps`
      # also installs the OS libraries it needs via apt, and those do not
      # survive between runs.
      #
      # Normally 12–26s. One run stalled here for 10 minutes — an apt mirror
      # having a bad day, not anything in this repo — and ate most of the job
      # budget before the tests even started. The timeout turns a repeat of that
      # into a fast, obvious failure worth re-running, rather than a job that
      # looks hung.
      - name: Install Chromium
        timeout-minutes: 4
        run: npx playwright install --with-deps chromium

      # `--grep-invert @screenshot`, via `test:visual:ci`.
      #
      # One test is tagged: the API reference's sidebar comparison, against
      # `tests/visual/__screenshots__/darwin/sidebar-operations.png`. Baselines
      # are per-platform and only the macOS one is committed, so on this Linux
      # runner there is nothing to compare against. Playwright treats a missing
      # snapshot as a failure and does not retry it, so running the tag here
      # would turn the job red on a baseline that is absent rather than on a
      # regression. Everything else in that suite asserts behaviour and is
      # platform-independent.
      #
      # This exclusion has a known cost, already paid once: 8de16a8 (PR #16)
      # added a second operation tree to that sidebar without regenerating the
      # baseline, and since nothing in CI compares it, the stale baseline went
      # through that merge and the next one unnoticed. It was caught only when
      # someone ran the suite locally, and re-baselined in 40182fc.
      #
      # To close that hole: generate Linux baselines in a container matching
      # this runner (Playwright publishes `mcr.microsoft.com/playwright` images
      # for exactly this), commit them, and switch this step to
      # `npm run test:visual` — at which point `test:visual:ci` is the same
      # command and can go. What does *not* work is letting Playwright write
      # the missing baseline here: the runner's filesystem is thrown away, so
      # every run would compare against a file it had just produced and pass
      # unconditionally. See `wiki/api-reference.md`.
      - name: Browser tests
        run: npm run test:visual:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/template/playwright-report/
          retention-days: 7

  docs:
    name: Docs site
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    # No browser step — the docs site has no Playwright suite, so this job is
    # install, type-check and build. It exists as a separate job rather than
    # extra steps on the one above because `defaults.run.working-directory`
    # takes a single path, and each project here is independent with its own
    # lockfile.
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/docs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          # Action inputs are not covered by `defaults.run.working-directory`.
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # `npm test` builds first, so this covers the build too — including the
      # wiki collection, which reads `packages/template/wiki/` from outside
      # this project's root. A checkout that somehow lacked the template would
      # fail here rather than silently publishing an empty Internals section.
      - name: Build and test
        run: npm test

      # Same reason as the template job's step of the same name: the routing
      # config the negotiation integration writes exists only in a
      # Vercel-adapter build, and `npm test` above built without one.
      - name: Build with the Vercel adapter and check its routing config
        run: |
          rm -rf dist .vercel
          VERCEL=1 npm run build
          node --test tests/markdown-twins.test.mjs

  smoke:
    name: Deployed smoke test
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      # One step, not one per project, and it always runs. A `deployment_status`
      # event is for exactly one deployment, so a step per project would leave
      # the other showing a grey "skipped" on every run — indistinguishable at a
      # glance from a smoke test that was silently not run, which is the failure
      # this job exists to catch. Picking the project inside the step keeps the
      # log honest: one step, one outcome, always green or red.
      #
      # `documentation-ekline-docs-template` contains `ekline-docs-template` as
      # a substring, so the docs slug is matched first — a looser template
      # pattern first would fire on both projects. An environment matching
      # neither fails loudly rather than guessing, because guessing would mean
      # running one site's assertions against the other's URL.
      #
      # There is one bypass secret per Vercel project, not one per team.
      # Vercel's docs: "You can use each available secret to bypass Deployment
      # Protection on all deployments in a project." Passing one project's
      # secret to the other's deployment fails exactly as if none were set —
      # measured: a single shared secret passed the docs site and failed all ten
      # template assertions.
      #
      # The secret is passed but not required. With Deployment Protection on and
      # no valid secret the test throws naming the protection and this fails,
      # correctly — the deployment really was not verified. If protection is
      # ever turned off, this passes with the secret absent and nothing here
      # needs changing.
      #
      # No `npm ci`: the smoke test is plain Node — `fetch` and `node:test`.
      - name: Smoke test the deployment
        env:
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          DOCS_SMOKE_URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS_TEMPLATE: ${{ secrets.VERCEL_BYPASS_SECRET_TEMPLATE }}
          BYPASS_DOCS: ${{ secrets.VERCEL_BYPASS_SECRET_DOCS }}
        run: |
          echo "environment='$ENVIRONMENT' url='$DOCS_SMOKE_URL'"

          # An empty URL is the one way this job could report success having
          # asserted nothing: the smoke test is opt-in on this variable so a
          # local `npm test` stays offline, and an empty value skips all ten
          # assertions and exits 0. Fail instead.
          test -n "$DOCS_SMOKE_URL" || {
            echo "::error::DOCS_SMOKE_URL is empty — the smoke test would skip every assertion and exit 0, reporting success having verified nothing."
            exit 1
          }

          case "$ENVIRONMENT" in
            *documentation-ekline-docs-template*)
              PROJECT=apps/docs
              export DOCS_SMOKE_BYPASS="$BYPASS_DOCS"
              ;;
            *ekline-docs-template-astro*)
              PROJECT=packages/template
              export DOCS_SMOKE_BYPASS="$BYPASS_TEMPLATE"
              ;;
            *)
              echo "::error::Unrecognized deployment environment '$ENVIRONMENT' — the project split in this job needs updating for this environment name."
              exit 1
              ;;
          esac

          echo "Smoke testing $PROJECT against $DOCS_SMOKE_URL"
          cd "$PROJECT"
          node --test tests/deployed-smoke.test.mjs
