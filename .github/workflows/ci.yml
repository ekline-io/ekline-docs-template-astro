name: CI

# Runs on pull requests and on pushes to the default branch.
#
# The Vercel build also runs `npm test` (see `buildCommand` in `vercel.json`),
# but that only gates the deploy, and only for the checks that need no browser.
# This workflow adds the two things that gate nothing today: type checking, and
# the browser tests that cover how Scalar and Starlight fit together — theme,
# search, navigation, and overlay stacking. Those all produce a page that builds
# perfectly and behaves wrongly, so nothing else can catch them.
on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, build and test
    runs-on: ubuntu-latest
    # A healthy run is ~2 minutes. Tight enough that a stall is caught early
    # rather than burning a quarter-hour of runner time.
    timeout-minutes: 10

    defaults:
      run:
        # Every step runs inside the shipped template. The repo root has no
        # dependencies of its own — each project under packages/ and apps/ is
        # independent and carries its own lockfile, so that a customer who
        # extracts packages/template/ gets a locked install. See
        # docs/superpowers/plans/2026-08-21-monorepo-move.md.
        working-directory: packages/template

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the version this template is verified against; see CLAUDE.md.
          node-version: 22.x
          cache: npm
          # `defaults.run.working-directory` does not reach action inputs, so
          # the cache needs the lockfile's path spelled out.
          cache-dependency-path: packages/template/package-lock.json

      # Runs at the repo root, not in the template, and needs no dependencies —
      # it is plain Node over the markdown under packages/template/. Placed
      # before the install so a docs-only regression reports in seconds.
      #
      # It catches prose that describes this monorepo to a reader who does not
      # have it: a link into apps/, a workflow path under .github/. Those all
      # resolve here and break in a customer's copy, where nothing fails loudly.
      - name: Check what ships to customers
        working-directory: .
        run: npm run check:shipped

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build and test
        run: npm test

      # Keyed on the Playwright version, not the lockfile.
      #
      # The browser download is ~150MB and only ever changes when Playwright
      # does. Hashing `package-lock.json` threw the cache away on every
      # unrelated dependency bump and re-downloaded it for nothing.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Runs even on a cache hit: the cache holds the browser, but `--with-deps`
      # also installs the OS libraries it needs via apt, and those do not
      # survive between runs.
      #
      # Normally 12–26s. One run stalled here for 10 minutes — an apt mirror
      # having a bad day, not anything in this repo — and ate most of the job
      # budget before the tests even started. The timeout turns a repeat of that
      # into a fast, obvious failure worth re-running, rather than a job that
      # looks hung.
      - name: Install Chromium
        timeout-minutes: 4
        run: npx playwright install --with-deps chromium

      # `--grep-invert @screenshot`, via `test:visual:ci`.
      #
      # Screenshot baselines are per-platform and only macOS ones are committed,
      # so the tagged comparisons would fail here on missing baselines rather
      # than on any real regression. Everything else in that suite asserts
      # behaviour and is platform-independent. To include the screenshots,
      # generate Linux baselines and commit them, then switch this to
      # `npm run test:visual`. See `wiki/api-reference.md`.
      - name: Browser tests
        run: npm run test:visual:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/template/playwright-report/
          retention-days: 7

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    # No browser step — the docs site has no Playwright suite, so this job is
    # install, type-check and build. It exists as a separate job rather than
    # extra steps on the one above because `defaults.run.working-directory`
    # takes a single path, and each project here is independent with its own
    # lockfile.
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/docs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          # Action inputs are not covered by `defaults.run.working-directory`.
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # `npm test` builds first, so this covers the build too — including the
      # wiki collection, which reads `packages/template/wiki/` from outside
      # this project's root. A checkout that somehow lacked the template would
      # fail here rather than silently publishing an empty Internals section.
      - name: Build and test
        run: npm test
