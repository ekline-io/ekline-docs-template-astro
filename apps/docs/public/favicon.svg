<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Potluck Docs">
	<!-- The Potluck Docs mark, in one theme-adaptive file.
	     Light: coral rim, paper well, ink bars. Dark: the well and bars swap, so
	     the mark reads as a coral ring with floating text — the dark treatment
	     the brand package specifies. The rim never changes color.
	     Geometry is the brand package's 64-unit grid; the bar corner radius is
	     exactly half the bar height, so do not change one without the other. -->
	<style>
		.well { fill: #FFFFFF }
		.bar  { fill: #231F20 }
		@media (prefers-color-scheme: dark) {
			.well { fill: #231F20 }
			.bar  { fill: #FFFFFF }
		}
	</style>
	<circle cx="32" cy="32" r="30" fill="#FF5656"/>
	<circle class="well" cx="32" cy="32" r="22"/>
	<rect class="bar" x="17" y="22.8" width="30" height="4.4" rx="2.2"/>
	<rect class="bar" x="17" y="29.8" width="25" height="4.4" rx="2.2"/>
	<rect class="bar" x="17" y="36.8" width="17" height="4.4" rx="2.2"/>
</svg>
